const CATS = ["Brush set", "Clear Sets", "Cling", "Ebook", "Embossing Folder", "FALL & HALLOWEEN", "Foil", "Kit", "Liquid Watercolor Inks", "Masterpieces", "Metal Dies", "New Release", "Paper Pads", "SALE  MINIMUM SALE ORDER $50.00", "Stencils", "Stick & Shine", "Stickers", "Tools", "VALENTINE", "Wood Mounted Rubber Stamp"];
const PAGE = 120;
let filtered = DATA.slice(), shown = 0;
const grid = document.getElementById('grid'), moreBtn = document.getElementById('more');
const catSel = document.getElementById('cat');
CATS.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);});
const fmt = n => n==null ? '' : '$' + n.toFixed(2);
function price(p){return p[3]===p[4]?fmt(p[3]):fmt(p[3])+' - '+fmt(p[4]);}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function card(p){
  const img = p[6] ? `<img loading="lazy" src="${p[6]}" alt="">` : `<div class="noimg">sin imagen</div>`;
  return `<a class="card" href="${p[7]}" target="_blank" rel="noopener">${img}<div class="info"><div class="name">${esc(p[1])}</div><div class="desc">${esc(p[2])}</div><div class="cats">${esc(p[5].join(' · '))}</div><div class="price">${price(p)}</div></div></a>`;
}
function renderMore(){
  const chunk = filtered.slice(shown, shown+PAGE);
  grid.insertAdjacentHTML('beforeend', chunk.map(card).join(''));
  shown += chunk.length;
  moreBtn.style.display = shown < filtered.length ? 'block' : 'none';
  document.getElementById('count').textContent = `Mostrando ${shown} de ${filtered.length} productos`;
}
function apply(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const c = catSel.value, s = document.getElementById('sort').value;
  filtered = DATA.filter(p=>{
    if (c && !p[5].includes(c)) return false;
    if (!q) return true;
    return p[1].toLowerCase().includes(q) || p[2].toLowerCase().includes(q);
  });
  const by = {
    name:(a,b)=>a[1].localeCompare(b[1]), name2:(a,b)=>b[1].localeCompare(a[1]),
    plo:(a,b)=>(a[3]??9e9)-(b[3]??9e9), phi:(a,b)=>(b[3]??-1)-(a[3]??-1)
  }[s];
  if (by) filtered.sort(by);
  grid.innerHTML=''; shown=0; renderMore();
}
document.getElementById('q').addEventListener('input', apply);
catSel.addEventListener('change', apply);
document.getElementById('sort').addEventListener('change', apply);
moreBtn.addEventListener('click', renderMore);
apply();
</script>
